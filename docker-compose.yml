services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventry_management_system
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend-laravel/Dockerfile
    env_file:
      - backend-laravel/.env
    environment:
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: inventry_management_system
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_password
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend-laravel:/var/www/backend-laravel
      - backend_vendor:/var/www/backend-laravel/vendor
      - backend_storage:/var/www/backend-laravel/storage

  frontend-build:
    build:
      context: frontend-react
      dockerfile: Dockerfile
      target: build
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_PUBLIC_BASE_PATH: ${VITE_PUBLIC_BASE_PATH:-/}
    volumes:
      - frontend_dist:/app/dist
    command: npm run build
    profiles:
      - build

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./deployment/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/backend-laravel/storage:ro

volumes:
  mysql_data:
  backend_vendor:
  backend_storage:
  frontend_dist:
