services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventry_management_system}
      MYSQL_USER: ${MYSQL_USER:-inventory_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventory_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend-laravel/Dockerfile
    restart: unless-stopped
    env_file:
      - backend-laravel/.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/backend-laravel/storage

  frontend:
    build:
      context: frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://43.204.141.93/api/v1}
        VITE_PUBLIC_BASE_PATH: ${VITE_PUBLIC_BASE_PATH:-/}
    restart: "no"
    profiles:
      - build

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./production-build/frontend:/usr/share/nginx/html:ro
      - ./deployment/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/backend-laravel/storage:ro

volumes:
  mysql_data:
  backend_storage:
